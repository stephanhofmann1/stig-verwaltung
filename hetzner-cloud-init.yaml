#cloud-config
# Wird bei der Servererstellung bei Hetzner unter "Cloud config" eingefügt.
# Richtet Docker, Firewall und das Zielverzeichnis ein, damit nach dem
# ersten Hochfahren nur noch das Projekt eingespielt werden muss.

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - ufw
  - unattended-upgrades

runcmd:
  # Nur SSH, HTTP und HTTPS. Postgres bleibt im Docker-Netz.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # Sicherheitsupdates automatisch einspielen.
  - systemctl enable --now unattended-upgrades

  # Anmeldung am Server nur mit Schluessel, nie mit Passwort.
  #
  # Als Zusatzdatei mit "00-" im Namen, NICHT ueber sed in der Hauptdatei.
  # Der Grund ist am 01.11.2026 auf dem laufenden Server aufgefallen:
  # cloud-init legt selbst /etc/ssh/sshd_config.d/50-cloud-init.conf mit
  # "PasswordAuthentication yes" an. Die Hauptdatei liest dieses
  # Verzeichnis oben ueber eine Include-Zeile ein, und bei SSH gewinnt der
  # ERSTE passende Eintrag -- die 50 schlaegt damit alles, was weiter
  # unten in der Hauptdatei steht. Ein per sed geaenderter Wert dort hat
  # also keine Wirkung, und der Server stand monatelang mit offener
  # Passwort-Anmeldung da, obwohl diese Datei sie abschalten wollte.
  #
  # Die 00 sortiert vor der 50 und gewinnt deshalb.
  - printf 'PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin prohibit-password\n' > /etc/ssh/sshd_config.d/00-nur-schluessel.conf
  - chmod 600 /etc/ssh/sshd_config.d/00-nur-schluessel.conf
  # Erst pruefen, dann neu laden: Eine kaputte Konfiguration wuerde den
  # Zugang zu einem gerade erstellten Server verschliessen.
  - sshd -t && systemctl reload ssh
  # Zur Gegenprobe im Serverprotokoll, was wirklich gilt.
  - sshd -T | grep -iE '^(passwordauthentication|permitrootlogin)' 

  - systemctl enable --now docker
  - mkdir -p /opt/stig
