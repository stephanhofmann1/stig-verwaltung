name: Prüfen und einspielen

# Was hier passiert, und warum in dieser Reihenfolge:
#
#   1. Bei JEDEM Push und bei jedem Pull Request laufen Typprüfung, alle
#      Tests und der Programmbau.
#   2. NUR wenn das durchgelaufen ist und nur auf dem Zweig `main` wird auf
#      den Server eingespielt.
#
# Das ist der eigentliche Gewinn gegenüber dem Skript von Hand: Das lud
# hoch und migrierte, egal ob der Stand funktioniert. Hier erreicht ein
# kaputter Stand den Server nicht.

on:
  push:
    branches: [main]
  pull_request:
  # Von Hand auslösbar, falls ein Einspielen wiederholt werden muss.
  workflow_dispatch:

# Zwei Einspielvorgänge gleichzeitig würden sich beim Migrieren in die
# Quere kommen. Der neuere wartet, der ältere läuft zu Ende.
concurrency:
  group: einspielen
  cancel-in-progress: false

jobs:
  pruefen:
    name: Typen, Tests, Programmbau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Abhängigkeiten
        working-directory: app
        run: npm ci

      - name: Typprüfung
        working-directory: app
        run: npx tsc --noEmit -p .

      - name: Tests
        working-directory: app
        # Absichtlich mit einer unerreichbaren Datenbank: Die Tests sind
        # alle rein, und das soll so bleiben. Schleicht sich ein Test ein,
        # der eine Datenbank braucht, fällt er hier auf -- und nicht erst,
        # wenn er im Betrieb gegen echte Mieterdaten läuft.
        env:
          DATABASE_URL: postgres://niemand@127.0.0.1:1/nichts
        run: npx tsx --test tests/*.test.ts

      - name: Programmbau
        working-directory: app
        run: npx next build

      - name: Was der Betrieb braucht, muss im Buendel liegen
        working-directory: app
        # Der Programmbau meldet Erfolg, auch wenn eine Datei fehlt, die
        # erst zur Laufzeit nachgeladen wird. pdfjs holt seinen Arbeiter
        # ueber einen zur Laufzeit zusammengesetzten Pfad -- die
        # Ablaufverfolgung sieht ihn nicht, und ohne ihn liest das Portal
        # kein einziges PDF.
        #
        # Vom 02.11. bis zum 05.11.2026 war genau das der Fall. Der
        # Fehler wird in lieseBeleg gefangen und als "keine Textebene"
        # gemeldet: Jedes PDF galt als Scan, 229 Belege kamen herein,
        # ohne dass eine Zeile daraus gelesen wurde. Kein Test hat das
        # bemerkt, weil im Quelltextbetrieb alles an seinem Platz liegt.
        run: |
          set -euo pipefail
          fehlt=0
          for datei in \
            .next/standalone/node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs \
            .next/standalone/node_modules/pdfjs-dist/legacy/build/pdf.mjs
          do
            if [ -f "$datei" ]; then
              echo "  da: $datei"
            else
              echo "::error::Fehlt im Buendel: $datei"
              fehlt=1
            fi
          done
          [ "$fehlt" = 0 ]

      - name: Migrationen gegen eine leere Datenbank
        # Nicht nur lesen, sondern wirklich einspielen. Eine Migration mit
        # einem Tippfehler fällt sonst erst auf dem Server auf, mitten
        # zwischen zwei anderen -- und dann steht die Datenbank halb
        # migriert da.
        run: |
          set -euo pipefail
          docker run -d --name pg -e POSTGRES_PASSWORD=test postgres:16

          # Warten, bis die Datenbank wirklich steht.
          #
          # pg_isready allein genuegt nicht. Das Postgres-Abbild startet
          # beim ersten Lauf einen voruebergehenden Server, um das
          # Datenverzeichnis einzurichten, und der nimmt ueber den
          # Unix-Socket schon Verbindungen an: pg_isready meldet "bereit",
          # der Einrichtungsserver geht gleich darauf wieder aus, und das
          # erste psql faellt in die Luecke. Am 05.11.2026 ist genau das
          # passiert -- "No such file or directory", 1,4 Sekunden nach dem
          # Start. Die Laeufe davor sind nicht sicherer gewesen, sie haben
          # das Rennen nur gewonnen.
          #
          # Deshalb zwei Bedingungen: die Marke, die das Abbild NACH der
          # Einrichtung schreibt, und eine echte Abfrage. Der Behaelter
          # ist hier immer frisch, also kommt die Marke auch immer.
          for i in $(seq 1 60); do
            if docker logs pg 2>&1 | grep -q "init process complete" \
               && docker exec -e PGPASSWORD=test pg \
                    psql -U postgres -d postgres -tAc 'select 1' \
                    >/dev/null 2>&1; then
              bereit=ja; break
            fi
            sleep 1
          done
          if [ "${bereit:-}" != ja ]; then
            echo "::error::Die Probe-Datenbank ist nicht hochgekommen."
            docker logs pg 2>&1 | tail -30
            exit 1
          fi
          echo "Datenbank steht nach $i Sekunden."

          for f in db/0*.sql; do
            echo "--- $f"
            docker exec -i -e PGPASSWORD=test pg \
              psql -v ON_ERROR_STOP=1 -q -U postgres -d postgres < "$f"
          done
          echo "Alle $(ls db/0*.sql | wc -l) Migrationen durchgelaufen."

  einspielen:
    name: Auf den Server
    needs: pruefen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produktion
    steps:
      - uses: actions/checkout@v4

      - name: Schlüssel und Rechnerkennung einrichten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Der Fingerabdruck des Server-Schlüssels, festgeschrieben.
          #
          # Ohne diese Prüfung würde der Lauf jeden Schlüssel annehmen, den
          # ihm die Gegenseite anbietet -- und damit die Zugangsdaten an
          # jeden ausliefern, der sich zwischen GitHub und den Server
          # setzen kann. Abgelesen am 01.11.2026 auf dem Server selbst.
          ERWARTET: "SHA256:vLUmmo5ntbDtoaad6+kk7ipWpx5Xl4+5lq0LIAYyD3k"
          HOST: 78.47.196.190
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -t ed25519 "$HOST" > /tmp/host.pub 2>/dev/null
          GEFUNDEN=$(ssh-keygen -lf /tmp/host.pub | awk '{print $2}')
          echo "erwartet:  $ERWARTET"
          echo "gefunden:  $GEFUNDEN"
          if [ "$GEFUNDEN" != "$ERWARTET" ]; then
            echo "::error::Der Server zeigt einen anderen Schlüssel als erwartet."
            echo "Entweder wurde der Server neu aufgesetzt -- dann muss der"
            echo "Fingerabdruck in dieser Datei angepasst werden -- oder es"
            echo "sitzt jemand dazwischen. Es wird nichts eingespielt."
            exit 1
          fi
          cat /tmp/host.pub >> ~/.ssh/known_hosts

      - name: Paket bauen
        # Was nicht im Repository liegt, geht auch nicht mit: Mieterdaten
        # und Befundberichte sind ausgeschlossen (siehe .gitignore). Auf
        # dem Server liegen sie schon und werden vom Auspacken nicht
        # angetastet.
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.next \
              --exclude=.github -czf /tmp/neu.tgz .
          ls -lh /tmp/neu.tgz

      - name: Hochladen
        run: scp -q /tmp/neu.tgz root@78.47.196.190:/opt/stig/neu.tgz

      - name: Auspacken, migrieren, starten
        # Das Fernstueck steht in einspielen-fern.sh und wird als DATEI
        # hinuebergelegt, nicht in die Standardeingabe geschrieben.
        #
        # Vorher lief es ueber `ssh host 'bash -s'` mit einem
        # Hier-Dokument. Das sieht sauber aus und ist eine Falle: bash -s
        # liest das Skript aus der Standardeingabe, und
        # `docker compose exec -T` in migrieren.sh liest aus derselben
        # Quelle -- es hat den Rest des Skripts verschluckt. Migrationen
        # liefen, die Anwendung wurde nie neu gebaut, und der
        # Gesundheitstest fragte die alte Fassung und meldete Erfolg.
        # Drei Laeufe hintereinander waren gruen und haben nichts
        # ausgeliefert (05.11.2026).
        #
        # Die Marke am Ende ist der Waechter dagegen: Fehlt sie, ist das
        # Skript unterwegs abgebrochen worden, und dieser Schritt faellt
        # durch -- egal wie gut die Zeilen davor aussahen.
        run: |
          set -euo pipefail
          scp -q einspielen-fern.sh root@78.47.196.190:/tmp/einspielen-fern.sh
          ssh root@78.47.196.190 'bash /tmp/einspielen-fern.sh' | tee /tmp/fern.log
          if ! grep -q '^EINSPIELEN-VOLLSTAENDIG$' /tmp/fern.log; then
            echo "::error::Das Fernstueck ist nicht zu Ende gelaufen."
            echo "Die Schlussmarke fehlt. Was davor stand, kann trotzdem"
            echo "ausgefuehrt worden sein -- der Stand auf dem Server ist"
            echo "also unklar und nicht einfach der alte."
            exit 1
          fi

      - name: Läuft es wirklich?
        # Ein Container, der "Up" meldet, kann trotzdem bei jeder Anfrage
        # abstürzen. Deshalb eine echte Anfrage -- und zwar von außen über
        # die öffentliche Adresse.
        #
        # NICHT über localhost:3000 auf dem Server: Dort lauscht nichts.
        # Der App-Container stellt 3000 nur im Docker-Netz bereit
        # (`expose`, nicht `ports`), nach außen geht allein der Proxy auf
        # 80 und 443. Der erste Lauf am 02.11.2026 ist genau daran
        # gescheitert und hat eine geglückte Einspielung als Fehlschlag
        # gemeldet.
        #
        # Von außen zu prüfen ist ohnehin das Richtige: Das deckt DNS,
        # Zertifikat, Proxy und Anwendung ab, also den Weg, den ein
        # Benutzer wirklich nimmt. Geprüft wird die Anmeldeseite, weil sie
        # ohne Sitzung antwortet -- und auf ihren Inhalt, nicht nur auf
        # den Statuscode: Eine Fehlerseite des Proxys käme auch mit 200.
        #
        # Gesucht wird das Passwortfeld und nicht der Produktname. Der Name
        # steht nur noch im Seitentitel und soll verschwinden, sobald ein
        # zweiter Mandant die Plattform nutzt -- die Prüfung wäre dann rot,
        # obwohl das Einspielen geglückt ist. Ein Eingabefeld dagegen muss
        # die Anmeldeseite immer tragen, und eine Fehlerseite des Proxys
        # trägt es nie.
        run: |
          for i in $(seq 1 15); do
            if curl -fsS --max-time 10 https://stig-immobilien.de/anmelden \
                 | grep -q 'type="password"'; then
              echo "Die Anwendung antwortet und liefert die Anmeldeseite aus."
              exit 0
            fi
            echo "Versuch $i: noch nicht erreichbar, warte ..."
            sleep 5
          done
          echo "::error::Die Anwendung antwortet nach dem Einspielen nicht."
          ssh root@78.47.196.190 'cd /opt/stig && ./start.sh logs --tail 40 app' || true
          exit 1
